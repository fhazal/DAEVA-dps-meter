<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3f73"/>
      <stop offset="0.55" stop-color="#18234a"/>
      <stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#5aa8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5aa8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8c4dc"/>
    </linearGradient>
    <linearGradient id="silverR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aab8d4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#2f74e0"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="0.5" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#2a66d8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="210"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="440" r="430" fill="url(#glow)"/>
    <!-- long shadow (45deg) of the emblem -->
    <path d="M300 640 L470 300 L555 300 L725 640 L760 760 L960 960 L960 1100 L640 1100 Z" fill="url(#shade)"/>
    <!-- top highlight -->
    <path d="M64 64 H960 V300 C760 250 260 250 64 330 Z" fill="#ffffff" opacity="0.06"/>
  </g>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- wings -->
  <g>
    <path d="M440 560 C380 470 290 420 168 420 C215 455 240 480 258 512 C215 505 185 510 150 528 C215 545 250 568 276 598 C240 600 214 612 190 632 C270 640 330 655 400 640 C425 620 440 590 440 560 Z" fill="url(#silver)"/>
    <path d="M584 560 C644 470 734 420 856 420 C809 455 784 480 766 512 C809 505 839 510 874 528 C809 545 774 568 748 598 C784 600 810 612 834 632 C754 640 694 655 624 640 C599 620 584 590 584 560 Z" fill="url(#silverR)"/>
  </g>

  <!-- meter bars -->
  <rect x="404" y="520" width="58" height="180" rx="22" fill="url(#bar)"/>
  <rect x="562" y="470" width="58" height="230" rx="22" fill="url(#bar)"/>
  <rect x="478" y="400" width="68" height="300" rx="24" fill="url(#bar)"/>
  <!-- crystal on the tallest bar -->
  <path d="M512 228 L566 330 L512 404 L458 330 Z" fill="url(#crystal)"/>
  <path d="M512 228 L512 404 L458 330 Z" fill="#ffffff" opacity="0.28"/>
  <!-- base line -->
  <rect x="380" y="716" width="264" height="22" rx="11" fill="#cfd8ea" opacity="0.9"/>
</svg>
