name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            .
      # The cache keeps compiled output between runs; always rebuild the app
      # crate itself so its build script re-embeds the icon and version.
      - name: Rebuild app crate from scratch
        run: cargo clean --release -p daeva-meter --manifest-path app/src-tauri/Cargo.toml
      # The updater key signs the installer (the .sig next to it); the
      # meter only installs updates signed with it. Secret set by hand.
      - name: Build meter installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@2.12.3 build
      - name: Show the icon embedded in the program
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = Get-ChildItem app/src-tauri/target/release -Filter *.exe | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          $bmp = $ico.ToBitmap(); $ms = New-Object IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          Write-Output "EMBEDDED_ICON_PNG_B64=$b64"
          Write-Output "::notice title=Embedded icon::$b64"
      - name: Build research toolkit
        run: cargo build --release -p research
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe dist/
          Copy-Item target/release/daeva-research.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: daeva-meter-windows
          path: dist/*
      # Tagged builds become a DRAFT release: nothing is public until it is
      # checked and published by hand. Only the installer (and latest.json
      # for the updater) is attached; the
      # research toolkit stays in the build artifacts.
      # A commit whose message contains [release] makes a draft for the
      # version in tauri.conf.json. GitHub creates the tag when the draft is
      # published; that tag doesn't trigger this workflow.
      - name: Release notes with checksum
        id: rel
        if: contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT
          $setup = Get-ChildItem dist -Filter *setup*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          $notes = Get-Content .github/release-notes.md -Raw
          # GitHub shows the uploaded file with dots instead of spaces.
          $shown = $setup.Name -replace ' ', '.'
          $notes += "`n``$shown``  `nSHA-256: ``$hash```n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $setup.FullName release/
          # latest.json: what the meter's updater reads (releases/latest/
          # download/latest.json), pointing at this release's installer.
          $sig = Get-Content "app/src-tauri/target/release/bundle/nsis/$($setup.Name).sig" -Raw
          $latest = [ordered]@{
            version = $v
            notes = "https://github.com/fhazal/DAEVA-dps-meter/releases/tag/v$v"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/fhazal/DAEVA-dps-meter/releases/download/v$v/$shown" } }
          }
          $latest | ConvertTo-Json -Depth 4 | Set-Content -Path release/latest.json -Encoding utf8NoBOM
      - name: Create draft release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Daeva Meter ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          files: release/*
          generate_release_notes: true
