[package]
name = "daeva-meter"
version = "0.2.14"
edition = "2021"
description = "Daeva Meter — AION 2 damage meter"
license = "MIT"

# Stand-alone workspace so the core can be built without these dependencies.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
miniz_oxide = "0.8"
lz4_flex = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
meter-core = { path = "../../crates/meter-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
