<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Click-through window that only ever shows event banners. */
  .stack { position: fixed; inset: 0; padding: 2px; display: flex; flex-direction: column; gap: 5px; }
  .stack.bottom { justify-content: flex-end; }
  /* Event card: icon, name and line on top, a status word on the right
     (time while it's coming up, "Start" when it begins), and for events
     that need keys a gold strip with the keys you hold. */
  .alert { --k: #e8b04b; position: relative; overflow: hidden; border-radius: 12px;
    background: rgba(24,25,30,0.96); border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: inn .35s cubic-bezier(.2,.9,.3,1.2); transition: opacity .45s, transform .45s; }
  .alert.start { --k: #7fd6a0; }
  .alert.out { opacity: 0; transform: translateY(-6px) scale(.98); }
  .bottom .alert.out { transform: translateY(6px) scale(.98); }
  .alert .top { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 0 12px; padding: 12px 16px 12px 14px; }
  .alert .ic { grid-row: span 2; width: 46px; height: 46px; display: grid; place-items: center; font-size: 30px; line-height: 1; }
  .alert .ic img { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; }
  .alert .t { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert .b { color: #a9abb3; font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert .tag { grid-row: span 2; font-size: 13.5px; font-weight: 700; color: var(--k); white-space: nowrap; }
  .alert .keys { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 16px 10px 26px;
    background: linear-gradient(180deg, rgba(232,176,75,0.10), rgba(232,176,75,0.06)); border-top: 1px solid rgba(232,176,75,0.35); }
  .alert .keys .lbl { color: #d9b878; font-size: 12.5px; }
  .alert .keys .val { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; font-size: 14.5px; }
  .alert .keys .val.none { color: #c9cad0; }
  .alert .keys svg { width: 18px; height: 18px; }
  .alert .life { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,0.04); }
  .alert .life i { display: block; height: 100%; width: 100%; background: var(--k); opacity: .6; transform-origin: left; animation: drain linear forwards; }
  @keyframes inn { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
  @keyframes drain { to { transform: scaleX(0); } }
</style>
</head>
<body>
<div class="stack bottom" id="stack"></div>
<script src="common.js"></script>
<script>
(() => {
  const D = window.Daeva;
  const box = document.getElementById("stack");
  const shown = new Set();
  const KEYED = new Set(["shugo_festival"]);
  const KEY_SVG = '<svg viewBox="0 0 24 24"><g fill="none" stroke="#e8b04b" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="7" r="3.6"/><path d="M9.6 9.6 20 20M15.5 15.5l2.4-2.4M18 18l2-2"/></g></svg>';
  async function poll() {
    try {
      const a = await D.callJSON("get_alerts");
      box.className = "stack " + (a.anchor === "top" ? "top" : "bottom");
      if (a.enabled) {
        for (const al of a.recent || []) {
          if (shown.has(al.key)) continue;
          shown.add(al.key);
          const el = document.createElement("div");
          el.className = "alert " + al.kind;
          const secs = Math.max(3, a.banner_secs || 12);
          const at = new Date(al.starts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          const tag = al.kind === "start" ? "Start" : at;
          // Events entered with keys show how many you hold.
          const keyed = KEYED.has(al.id);
          const n = a.keys && a.keys[al.id];
          const keys = keyed ? `<div class="keys"><span class="lbl">Keys held</span><span class="val${n == null ? " none" : ""}">${KEY_SVG}${n == null ? "(Not detected)" : Number(n).toLocaleString()}</span></div>` : "";
          el.innerHTML = `<div class="top"><span class="ic">${D.eventIcon(al.id, al.emoji, 44)}</span><span class="t">${D.esc(al.title)}</span><span class="tag">${D.esc(tag)}</span><span class="b">${D.esc(al.body)}</span></div>${keys}<span class="life"><i style="animation-duration:${secs}s"></i></span>`;
          if (a.anchor === "top") box.prepend(el); else box.appendChild(el);
          while (box.children.length > 3) (a.anchor === "top" ? box.lastElementChild : box.firstElementChild).remove();
          setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, Math.max(3, a.banner_secs || 12) * 1000);
        }
      }
    } catch (e) { console.warn(e); }
    setTimeout(poll, 400);
  }
  poll();
})();
</script>
</body>
</html>
