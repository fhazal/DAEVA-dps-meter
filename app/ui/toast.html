<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts</title>
<link rel="stylesheet" href="common.css">
<style>
  /* Click-through window that only ever shows event banners. */
  .stack { position: fixed; inset: 0; padding: 2px; display: flex; flex-direction: column; gap: 5px; }
  .stack.bottom { justify-content: flex-end; }
  .alert { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 1px 9px; padding: 8px 12px 8px 9px;
    background: rgba(20,19,17,0.95); border: 1px solid var(--accent); border-left: 4px solid var(--accent); border-radius: 9px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5); animation: inn .28s ease-out; transition: opacity .45s, transform .45s; }
  .alert.start { border-color: var(--good); }
  .alert.out { opacity: 0; transform: translateY(-6px); }
  .bottom .alert.out { transform: translateY(6px); }
  .alert .em { grid-row: span 2; font-size: 22px; line-height: 1; text-align: center; }
  .alert .t { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert .b { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes inn { from { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="stack bottom" id="stack"></div>
<script src="common.js"></script>
<script>
(() => {
  const D = window.Daeva;
  const box = document.getElementById("stack");
  const shown = new Set();
  async function poll() {
    try {
      const a = await D.callJSON("get_alerts");
      box.className = "stack " + (a.anchor === "top" ? "top" : "bottom");
      if (a.enabled) {
        for (const al of a.recent || []) {
          if (shown.has(al.key)) continue;
          shown.add(al.key);
          const el = document.createElement("div");
          el.className = "alert " + al.kind;
          el.innerHTML = `<span class="em">${D.esc(al.emoji || "🔔")}</span><span class="t">${D.esc(al.title)}</span><span class="b">${D.esc(al.body)}</span>`;
          if (a.anchor === "top") box.prepend(el); else box.appendChild(el);
          while (box.children.length > 3) (a.anchor === "top" ? box.lastElementChild : box.firstElementChild).remove();
          setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, Math.max(3, a.banner_secs || 12) * 1000);
        }
      }
    } catch (e) { console.warn(e); }
    setTimeout(poll, 400);
  }
  poll();
})();
</script>
</body>
</html>
