<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="common.css">
<style>
  .f { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; align-items: center; }
  .f label { color: var(--muted); font-size: 12px; }
  .f .hint { grid-column: 2; font-size: 11px; color: var(--dim); margin-top: -2px; }
  .f input[type=text], .f input[type=password], .f input[type=number], .f select { width: 100%; }
  .f .inline { display: flex; align-items: center; gap: 8px; }
  .bar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: rgba(var(--bg), 0.98); }
  .bar .sp { flex: 1; }
  .errs { color: var(--bad); font-size: 12px; margin-top: 8px; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .colpick { display: flex; flex-wrap: wrap; gap: 5px; }
  .cp { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
  .cp:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
  .cp.on { color: #1a1408; background: var(--accent, #d9a441); border-color: transparent; font-weight: 600; }
  .cp:disabled { opacity: .45; cursor: default; }
  .cmd { color: var(--accent); font-weight: 600; }
  .st-ok b { color: var(--good); } .st-bad b { color: var(--bad); } .st-save { color: var(--warn); font-weight: 600; }
  .warnbox { border: 1px solid rgba(231,180,76,0.35); background: rgba(231,180,76,0.08); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  /* Tabs down the side; one section at a time (all of them while searching). */
  .split { flex: 1; min-height: 0; display: flex; }
  .side { width: 184px; flex: none; display: flex; flex-direction: column; padding: 10px 8px; background: rgba(255,255,255,0.025); border-right: 1px solid var(--line); }
  .side .find { margin: 0 2px 10px; width: auto; }
  .tab { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 7px; background: none; color: #cfccc4; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; margin-bottom: 2px; }
  .tab:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .tab svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .tab.on { position: relative; background: var(--accent-soft); color: var(--accent); }
  .tab.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
  .tab .badge { margin-left: auto; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 0 5px; border-radius: 4px; }
  .tab .badge.adv { color: var(--muted); background: rgba(255,255,255,0.06); }
  .tab.warn::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-left: auto; }
  .side .ver { margin-top: auto; padding: 8px 10px 0; font-size: 11px; color: var(--dim); border-top: 1px solid var(--line); }
  .split .scroll { flex: 1; }
  section[data-tab] { display: none; }
  section[data-tab].on, .searching section[data-tab].hit { display: block; }
  .searching section[data-tab]:not(.hit) { display: none; }
  section h2:first-child { margin-top: 2px; }
  .sh { color: var(--muted); font-size: 12px; margin: -4px 0 12px; }
  .fr { display: contents; }
  .fr.gone, .gone { display: none !important; }
  .nohit { color: var(--muted); padding: 20px 4px; display: none; }
  .searching .nohit.show { display: block; }
  /* Layout picker */
  .picks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 4px 0 14px; }
  .pick { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: rgba(255,255,255,0.03); cursor: pointer; position: relative; }
  .pick:hover { border-color: rgba(255,255,255,0.18); }
  .pick.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px var(--accent-soft); }
  .pick b { font-size: 13px; } .pick p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .pick .ok { position: absolute; top: 8px; right: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #1a1408; font-size: 11px; font-weight: 800; text-align: center; line-height: 16px; display: none; }
  .pick.on .ok { display: block; }
  .thumb { height: 84px; border-radius: 6px; background: rgba(0,0,0,0.35); margin-bottom: 8px; padding: 7px; display: flex; flex-direction: column; gap: 4px; }
  .thumb i { display: block; height: 7px; border-radius: 2px; background: rgba(255,255,255,0.12); }
  .thumb .g { background: var(--accent); opacity: .55; } .thumb .y { background: rgba(255,255,255,0.28); }
</style>
</head>
<body>
<div class="shell">
  <div class="titlebar" data-drag>
    <div class="title" data-drag>Settings</div>
    <button class="icon-btn close" data-win="close" title="Close"></button>
  </div>
  <div class="split">
    <nav class="side" id="side"></nav>
    <div class="scroll"><div class="content" id="form"></div></div>
  </div>
  <div class="bar"><span class="muted" id="msg"></span><span class="sp"></span><button class="btn" data-win="close">Cancel</button><button class="btn primary" id="bSave">Save</button></div>
</div>
<script src="common.js"></script>
<script>
(() => {
  const D = window.Daeva;
  document.querySelector(".titlebar [data-win=close]").innerHTML = D.icon("close");
  D.wireTitlebar();
  let s = null;

  const F = (label, html, hint) => `<div class="fr"><label>${label}</label><div>${html}</div>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
  const chk = (k, text) => `<span class="inline"><input type="checkbox" data-k="${k}"> ${text || ""}</span>`;
  const txt = (k, ph, type) => `<input type="${type || "text"}" data-k="${k}" placeholder="${ph || ""}">`;
  const num = (k, min, max, step) => `<input type="number" data-k="${k}" min="${min}" max="${max}" step="${step || 1}">`;
  const rng = (k, min, max, step) => `<span class="inline"><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" style="flex:1"><span class="num muted" data-v="${k}"></span></span>`;
  const sel = (k, opts) => `<select data-k="${k}">${opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>`;

  const COLS = [["crit", "Crit %"], ["back", "Back %"], ["perfect", "Perfect %"], ["hits", "Hits"], ["max", "Max hit"], ["hps", "Healing/s"], ["taken", "Damage taken"], ["deaths", "Deaths"]];
  let cols = [];
  function paintCols() {
    document.querySelectorAll("#colpick .cp").forEach((b) => {
      const on = cols.includes(b.dataset.col);
      b.classList.toggle("on", on);
      b.textContent = (on ? "✓ " : "") + COLS.find((c) => c[0] === b.dataset.col)[1];
      b.disabled = !on && cols.length >= 3;
    });
  }
  function wireCols() {
    document.querySelectorAll("#colpick .cp").forEach((b) => (b.onclick = () => {
      const k = b.dataset.col;
      cols = cols.includes(k) ? cols.filter((c) => c !== k) : cols.length < 3 ? cols.concat(k) : cols;
      paintCols();
    }));
  }
  // Tabs: [id, label, icon path(s) on a 24 grid, badge].
  const TABS = [
    ["general", "General", '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'],
    ["layout", "Layout", '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>', "NEW"],
    ["look", "Overlay look", '<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.7 1.7-1.7h2c3 0 5.5-2.5 5.5-5.5C22 6 17.5 2 12 2z"/>'],
    ["fights", "Fights", '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/>'],
    ["alerts", "Event alerts", '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'],
    ["hotkeys", "Hotkeys", '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>'],
    ["bot", "Daeva bot", '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>'],
    ["capture", "Capture", '<path d="M12 20h.01"/><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.9a10 10 0 0 1 14 0"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/>', "ADV"],
  ];
  let tab = "general";
  try { tab = localStorage.getItem("daeva.setTab") || "general"; } catch {}
  function buildSide() {
    document.getElementById("side").innerHTML = `<input type="text" class="find" id="find" placeholder="🔍 Search settings…">`
      + TABS.map(([id, label, ic, badge]) => `<button type="button" class="tab" data-t="${id}"><svg viewBox="0 0 24 24">${ic}</svg>${label}${badge ? `<span class="badge${badge === "ADV" ? " adv" : ""}">${badge}</span>` : ""}</button>`).join("")
      + `<div class="ver" id="sideVer">Daeva Meter · BajuBesi Labs</div>`;
    document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { document.getElementById("find").value = ""; search(""); showTab(b.dataset.t); }));
    document.getElementById("find").oninput = (e) => search(e.target.value);
  }
  function showTab(id) {
    if (!TABS.some((t) => t[0] === id)) id = "general";
    tab = id;
    try { localStorage.setItem("daeva.setTab", id); } catch {}
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.t === id));
    document.querySelectorAll("section[data-tab]").forEach((s) => s.classList.toggle("on", s.dataset.tab === id));
    document.querySelector(".split .scroll").scrollTop = 0;
  }
  // Searching shows every tab, with only the settings whose text matches.
  function search(q) {
    q = q.trim().toLowerCase();
    const form = document.getElementById("form");
    form.classList.toggle("searching", !!q);
    let any = false;
    document.querySelectorAll("section[data-tab]").forEach((sec) => {
      let hit = false;
      // A tab's own name ("hotkeys", "capture") shows all of it.
      const whole = !!q && TABS.some(([id, label]) => id === sec.dataset.tab && label.toLowerCase().includes(q));
      sec.querySelectorAll(".fr, .sr").forEach((r) => {
        const ok = !q || whole || r.textContent.toLowerCase().includes(q) || [...r.querySelectorAll("input, select")].some((i) => (i.placeholder || "").toLowerCase().includes(q));
        r.classList.toggle("gone", !ok);
        hit = hit || ok;
      });
      sec.classList.toggle("hit", hit);
      any = any || hit;
    });
    document.getElementById("nohit").classList.toggle("show", !!q && !any);
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", !q && b.dataset.t === tab));
    if (!q) showTab(tab);
  }
  function paintPicks() {
    const v = document.querySelector('[data-k="layout"]').value || "classic";
    document.querySelectorAll(".pick").forEach((p) => p.classList.toggle("on", p.dataset.l === v));
  }
  function build() {
    document.getElementById("form").innerHTML = `
    <section data-tab="layout">
    <h2>Layout</h2><div class="sh">How the overlay shows a fight. Switch any time with the panels button on the meter, or Ctrl+Shift+O.</div>
    <input type="text" data-k="layout" hidden>
    <div class="picks sr">
      <div class="pick" data-l="classic"><span class="ok">✓</span><div class="thumb"><i class="g" style="height:16px"></i><i></i><i class="y"></i><i></i><i></i></div><b>Classic</b><p>The whole party, ranked</p></div>
      <div class="pick" data-l="solo"><span class="ok">✓</span><div class="thumb"><i class="g" style="height:10px"></i><i class="y" style="height:30px"></i><i></i><i style="width:60%"></i></div><b>Solo</b><p>Just you, in a small card</p></div>
    </div>
    <h2>Solo card</h2><div class="f">
      ${F("Show", `<div class="row-btns">${chk("solo.rank", "Rank and share in the party")}${chk("solo.chips", "Crit, double, perfect, front, back")}${chk("solo.footer", "Odyle, party DPS and ping")}</div>`, "The boss line and your DPS are always there. Scale (Overlay look) sizes the card too.")}
    </div>
    </section>
    <section data-tab="look">
    <h2>Overlay look</h2><div class="f">
      ${F("Background opacity", rng("opacity", 0.2, 1, 0.02))}
      ${F("Scale", rng("scale", 0.7, 1.6, 0.05), "Quicker: hold Ctrl and turn the mouse wheel over the meter.")}
      ${F("Rows shown", num("rows", 1, 24))}
      ${F("Main number", sel("primary_metric", [["dps", "DPS"], ["dmg", "Total damage"], ["share", "Damage share"]]))}
      ${F("Accent colour", `<input type="color" data-k="accent">`)}
      ${F("Show", `<div class="row-btns">${chk("show_target", "Target & HP")}${chk("show_heal", "Healing")}</div>`)}
      ${F("Extra columns", `<div class="colpick" id="colpick">${COLS.map(([k, l]) => `<button type="button" class="cp" data-col="${k}">${l}</button>`).join("")}</div>`, "Up to 3, shown between the name and the main number. Widen the meter for more room.")}
      ${F("Players listed", sel("show_players", [["auto", "Auto: my party when I'm in one, else everyone"], ["all", "Everyone fighting your target"], ["party", "Me and my party"], ["me", "Only me"]]), "Auto follows the game's party list: dungeons, rooms and parties at world bosses show your group; solo you see everyone. Others' damage is still counted (share %, fight totals); this only hides their rows.")}
      ${F("Privacy", chk("anonymize_others", "Hide other players' names"), "For screenshots and streams. Your own name stays visible.")}
      ${F("Window", `<div class="row-btns">${chk("always_on_top", "Always on top")}${chk("click_through", "Click-through")}</div>`)}
    </div>
    </section>
    <section data-tab="alerts">
    <h2>Event alerts</h2>
    <div class="warnbox">Banners on the overlay before AION 2 events start, using the same schedule as the Daeva Discord bot (aion2.bajubesi.org). Gartua times are estimates, as on Discord.</div>
    <div class="f">
      ${F("", chk("alerts.enabled", "Show event alerts"))}
      ${F("Warn before start (min)", num("alerts.lead_minutes", 0, 120), "0 = only when the event starts.")}
      ${F("", `<div class="row-btns">${chk("alerts.at_start", "Also when it starts")}${chk("alerts.sound", "Play a sound")}${chk("alerts.show_next", "Show next events under the meter")}</div>`)}
      ${F("Sound volume", `<span class="inline"><input type="range" data-k="alerts.volume" min="0" max="100" step="5" style="flex:1"><span class="num muted" data-vol></span></span>`, "A short chime: two notes for ‘starting soon’, three rising notes when it starts.")}
      ${F("Banner stays (s)", num("alerts.banner_secs", 3, 120))}
      ${F("Show alerts", sel("alerts.position", [["custom", "Where I dragged them"], ["above_meter", "Above the meter"], ["below_meter", "Below the meter"], ["screen_top_right", "Top right, beside the minimap"], ["screen_top_center", "Top centre of the screen"], ["screen_top_left", "Top left of the screen"]]), "To move them: with the meter unlocked, drag any banner (or a test alert) where you want it. The spot is kept as a share of the screen, so it stays put at any resolution. While the meter is locked, banners are click-through.")}
      ${F("Banner size", sel("alerts.size", [["normal", "Normal"], ["compact", "Compact (one line)"]]))}
      ${F("During fights", chk("alerts.hold_in_fight", "Hold banners until the fight ends (the chime still plays)"), "So nothing pops up in the middle of a boss. Events that start during the fight show as soon as it's over.")}
      ${F("Alert me for", `<div class="row-btns" id="evList"><span class="muted">Loading events…</span></div>`, "Hourly events (Shugo Festival, Dimensional Invasion) are off by default.")}
      ${F("Schedule feed", txt("alerts.feed_url"), `<span id="evStatus"></span>`)}
      ${F("", `<button class="btn" id="bTestAlert">Show a test alert</button><div class="muted" id="alertCheck" style="font-size:11.5px;margin-top:4px"></div>`, "It stays 30 seconds: drag it where you want event alerts.")}
    </div>
    </section>
    <section data-tab="fights">
    <h2>Fights</h2><div class="f">
      ${F("DPS clock", sel("dps_clock", [["boss", "Boss fight: first hit on the boss → kill, adds included (recommended)"], ["personal", "Your time: your first hit → your last hit"], ["fight", "Whole fight, including trash"]]), "Boss fight is how Details! and ACT count an encounter. Without a boss or elite, DPS uses the whole fight. Hover a DPS number to see the rule in use.")}
      ${F("Personal bests", chk("personal_bests", "Tell me when I beat my best DPS on a boss"), "Compared with your saved fights on the same boss, at least 30 s long. Only your own character counts.")}
      ${F("End fight after idle (s)", num("idle_timeout", 2, 120, 1))}
      ${F("", chk("end_on_target_death", "End fight when the main target dies"))}
      ${F("", chk("merge_summons", "Count summon/pet damage for its owner"))}
      ${F("Keep saved fights (days)", num("history_keep_days", 1, 365))}
    </div>
    </section>
    <section data-tab="capture">
    <h2>Capture</h2><div class="sh">Only needed when the meter doesn't see the game. Most players never change these.</div><div class="f">
      ${F("Game process names", txt("process_names", "aion2"), "Comma separated, matched anywhere in the .exe name.")}
      ${F("Extra server ports", txt("manual_ports", "e.g. 7777"), "Only needed if auto-detection fails.")}
      ${F("Ignore ports", txt("ignore_ports", "80, 443"))}
      ${F("Network adapter filter", txt("device_filter", "blank = all adapters"))}
      ${F("", `<div class="row-btns"><button class="btn" id="bRestart">Restart capture</button>${chk("demo", "Demo mode (simulated party)")}</div>`)}
    </div>
    </section>
    <section data-tab="hotkeys">
    <h2>Hotkeys</h2><div class="sh">They work in game too. Format: Ctrl+Shift+F9. Leave one empty to turn it off.</div><div class="f">
      ${F("Toggle click-through", txt("hotkeys.click_through"))}
      ${F("End fight", txt("hotkeys.reset"))}
      ${F("Hide / show overlay", txt("hotkeys.hide"))}
      ${F("Copy summary", txt("hotkeys.copy"))}
      ${F("Report a problem", txt("hotkeys.report"))}
      ${F("Switch layout", txt("hotkeys.layout"), "Classic ⇄ Solo.")}
      ${F("Research marker", txt("hotkeys.marker"), "While a research recording runs: one press marks “⚑ bug here”.")}
    </div>
    <div class="errs" id="hkErr"></div>
    </section>
    <section data-tab="bot">
    <h2>Share with Daeva bot</h2>
    <div class="warnbox">Puts your boss and elite fights on the DPS boards at aion2.bajubesi.org and in the Daeva daily recap on Discord. Off by default. Get your token with <b>/meter link</b> in our Discord. “Only me” never sends other players' names.</div>
    <div class="f">
      ${F("", chk("share.enabled", "Enable sharing"))}
      ${F("Token", `<div class="row-btns">${txt("share.token", "paste the token from /meter link", "password")}<button class="btn" id="bTestShare">Test connection</button></div><div class="muted" id="shareStatus" style="font-size:11.5px;margin-top:4px"></div>`, "Run <span class=\"cmd\">/meter link</span> in our Discord to get yours. Running it again replaces the old token.")}
      ${F("Endpoint URL", txt("share.endpoint", "https://aion2.bajubesi.org/api/meter"), "Leave as it is unless your community runs its own Daeva bot.")}
      ${F("What to share", sel("share.scope", [["self", "Only me"], ["party", "Everyone in the fight"], ["none", "Nothing"]]))}
      ${F("Minimum fight length (s)", num("share.min_duration", 0, 3600))}
      ${F("", chk("share.share_loot", "Share rare loot drops"))}
      ${F("Minimum loot grade", num("share.min_loot_grade", 0, 10))}
    </div>
    </section>
    <section data-tab="general">
    <h2>General</h2><div class="f">
      ${F("Server name", txt("server_name", "detected automatically"), "Shown at the bottom of the meter. Leave empty: the meter reads your server from the game (Beritra is built in).")}
    </div>
    <h2>Data</h2>
    <div class="row-btns sr">
      <button class="btn primary" id="bReport">Report a problem</button>
      <button class="btn" data-folder="data">Open data folder</button>
      <button class="btn" data-folder="definitions">Definitions folder</button>
      <button class="btn" id="bReload">Reload definitions</button>
      <button class="btn" id="bNames">Monster &amp; skill names</button>
      <button class="btn" id="bRefreshNames">Update names now</button>
    </div>
    <div class="f" style="margin-top:8px">${F("Names", `<div class="row-btns">${chk("lookup_names", "Get monster and skill names from aion2.gaming.tools")}${chk("game_art", "Show game icons (classes, skills, monsters)")}</div><div class="muted" id="namesStatus" style="font-size:11.5px;margin-top:4px">…</div>`, "Downloads their monster and skill lists at most once a day and keeps a copy for offline use. Names you type yourself always win. Game icons are NCSOFT's, shown via gaming.tools. With thanks to the AION 2 Global Database team.")}</div>
    <div class="f" style="margin-top:8px">${F("Updates", `<div class="row-btns">${chk("check_updates", "Check GitHub for new versions")}<button class="btn" id="bCheckUpd">Check now</button></div><div class="muted" id="updStatus" style="font-size:11.5px;margin-top:4px">…</div>`, "Asks GitHub for the latest published Daeva Meter release at start-up and every 6 hours. Nothing about you is sent. A new version shows a notice under the meter; Download opens the release page.")}</div>
    <div class="f" style="margin-top:8px">${F("Testers", chk("show_research", "Show research tools (flask button in the header)"), "Research mode records game traffic with markers, for decoding after a game patch. Most players don't need it: use Report a problem instead.")}</div>
    <p class="muted sr" style="font-size:11.5px"><b>Report a problem</b> saves the last 5 minutes of game traffic, what the meter showed each second and what it noticed (fights, card, party, zone) as one zip on your Desktop (also Ctrl+Shift+P, even in game). Send that file when something looks wrong.</p>
    <p class="muted sr" style="font-size:11.5px">Drop an updated <span class="mono">aion2.json</span> or <span class="mono">names.json</span> in the definitions folder to override the bundled copy after a game patch.</p>
    </section>
    <div class="nohit" id="nohit">No settings match that search.</div>`;
    document.querySelectorAll(".pick").forEach((p) => (p.onclick = () => { document.querySelector('[data-k="layout"]').value = p.dataset.l; paintPicks(); }));
  }

  function get(o, path) { return path.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
  function set(o, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((a, k) => (a[k] = a[k] || {}), o)[last] = v; }
  const LISTS = { process_names: "str", manual_ports: "num", ignore_ports: "num" };

  function fill() {
    document.querySelectorAll("[data-k]").forEach((el) => {
      const k = el.dataset.k;
      let v = get(s, k);
      if (LISTS[k]) v = (v || []).join(", ");
      if (el.type === "checkbox") el.checked = !!v; else el.value = v == null ? "" : v;
    });
    cols = (s.columns || []).filter((c) => COLS.some((x) => x[0] === c)).slice(0, 3);
    paintCols();
    updateRanges();
  }
  function updateVol() {
    const v = document.querySelector('[data-k="alerts.volume"]');
    const o = document.querySelector("[data-vol]");
    if (v && o) o.textContent = Math.round(Number(v.value)) + "%";
  }
  function updateRanges() {
    document.querySelectorAll("[data-v]").forEach((el) => {
      const inp = document.querySelector(`[data-k="${el.dataset.v}"]`);
      el.textContent = Math.round(Number(inp.value) * 100) + "%";
    });
  }
  function collect() {
    const out = JSON.parse(JSON.stringify(s));
    document.querySelectorAll("[data-k]").forEach((el) => {
      const k = el.dataset.k;
      let v;
      if (el.type === "checkbox") v = el.checked;
      else if (el.type === "number" || el.type === "range") v = Number(el.value);
      else v = el.value.trim();
      if (LISTS[k]) {
        v = v.split(/[,\s]+/).filter(Boolean);
        if (LISTS[k] === "num") v = v.map(Number).filter((n) => n > 0 && n < 65536);
      }
      set(out, k, v);
    });
    out.columns = cols.slice();
    if (catalog.length) {
      const known = new Set(catalog.map((e) => e.id));
      const keep = ((s.alerts && s.alerts.muted) || []).filter((id) => !known.has(id));
      out.alerts.muted = keep.concat([...document.querySelectorAll("[data-ev]")].filter((c) => !c.checked).map((c) => c.dataset.ev));
    }
    return out;
  }

  let catalog = [];
  async function loadEvents() {
    try {
      const v = JSON.parse(await D.call("get_events"));
      catalog = v.catalog || [];
      const muted = new Set((s.alerts && s.alerts.muted) || []);
      document.getElementById("evList").innerHTML = catalog.length
        ? catalog.map((e) => `<span class="inline"><input type="checkbox" data-ev="${D.esc(e.id)}" ${muted.has(e.id) ? "" : "checked"}> ${D.esc(e.emoji)} ${D.esc(e.name)}</span>`).join("")
        : '<span class="muted">No schedule yet — check the feed address below.</span>';
      document.getElementById("evStatus").textContent = v.error
        ? v.error
        : v.fetched_at ? "Updated " + D.when(v.fetched_at) + " · next: " + (v.upcoming || []).slice(0, 3).map((o) => o.short + " " + new Date(o.starts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })).join(", ") : "Fetching…";
    } catch (e) { document.getElementById("evList").textContent = String(e); }
  }

  async function loadUpdate() {
    const el = document.getElementById("updStatus");
    try {
      const u = JSON.parse(await D.call("update_status"));
      const when = u.checked_at ? " · checked " + D.when(u.checked_at) : "";
      el.textContent = u.available ? `You're on v${u.current} · ${u.available} is available${when}`
        : u.error ? `You're on v${u.current} · couldn't check: ${u.error}${when}`
        : u.latest ? `You're on v${u.current} · up to date${when}`
        : `You're on v${u.current}` + (u.enabled ? " · checking shortly" : "");
    } catch (e) { el.textContent = String(e); }
  }

  // "Monster data: 12,345 monsters · updated 2 h ago", or downloading / the error.
  async function loadNames() {
    const el = document.getElementById("namesStatus");
    try {
      const n = JSON.parse(await D.call("get_names"));
      el.textContent = n.lookup_on === false ? "Monster data: off"
        : n.site_bulk ? `Monster data: ${n.site_bulk.npcs.toLocaleString()} monsters, ${n.site_bulk.skills.toLocaleString()} skills · updated ${D.when(n.site_bulk.at)}`
        : n.site_loading ? "Monster data: downloading…"
        : n.lookup_status ? `Monster data: ${n.lookup_status}. Retrying in a minute.`
        : "Monster data: not downloaded yet";
      if (n.site_loading || (!n.site_bulk && n.lookup_on !== false)) setTimeout(loadNames, 3000);
    } catch (e) { el.textContent = ""; }
  }

  async function init() {
    s = await D.call("get_settings");
    D.applyTheme({ accent: s.accent, opacity: 0.97 });
    buildSide();
    build();
    wireCols();
    fill();
    paintPicks();
    showTab(tab);
    document.querySelectorAll("input[type=range]").forEach((r) => (r.oninput = () => { if (r.dataset.k === "alerts.volume") updateVol(); else updateRanges(); }));
    updateVol();
    loadEvents();
    loadUpdate();
    loadNames();
    document.getElementById("bCheckUpd").onclick = async () => {
      await D.call("check_updates_now");
      document.getElementById("updStatus").textContent = "Checking…";
      setTimeout(loadUpdate, 4000);
    };
    // Sends a tiny "ping" with the token typed in (saved or not) and reports whether the Daeva bot accepts it.
    document.getElementById("bTestShare").onclick = async () => {
      const out = document.getElementById("shareStatus");
      const endpoint = document.querySelector('[data-k="share.endpoint"]').value.trim();
      const token = document.querySelector('[data-k="share.token"]').value.trim();
      // Coloured result: green ✓ / red ✕ headline, grey advice, amber "Remember to Save."
      const show = (kind, head, rest, save) => {
        out.className = kind === "ok" ? "st-ok" : kind === "bad" ? "st-bad" : "muted";
        out.textContent = "";
        if (head) { const b = document.createElement("b"); b.textContent = head; out.append(b, " "); }
        const r = document.createElement("span"); r.className = "muted"; r.textContent = rest; out.append(r);
        if (save) { const sv = document.createElement("span"); sv.className = "st-save"; sv.textContent = " Remember to Save."; out.append(sv); }
      };
      if (!token) { show("bad", "✕ No token.", "Paste your token first (run /meter link in our Discord)."); return; }
      if (!/^https:\/\//.test(endpoint)) { show("bad", "✕ Wrong endpoint.", "It must start with https://"); return; }
      show("", "", "Testing…");
      try {
        const r = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ type: "ping", meter: "daeva-meter" }),
          signal: AbortSignal.timeout(10000),
        });
        if (r.ok) show("ok", "✓ Connected.", "Your token works.", true);
        else if (r.status === 401) show("bad", "✕ Token not recognised.", "Run /meter link again and paste the new token.");
        else if (r.status === 429) show("bad", "✕ Too many uploads.", "Try again in a while.");
        else show("bad", "✕ The server answered HTTP " + r.status + ".", "Try again later.");
      } catch (e) {
        show("bad", "✕ Couldn't reach the server.", "Check your internet connection and the endpoint.");
      }
    };
    // After a test alert, check that the alert window really drew it.
    document.getElementById("bTestAlert").onclick = async () => {
      const out = document.getElementById("alertCheck");
      await D.call("test_alert");
      out.className = "muted"; out.textContent = "Checking the alert window…";
      setTimeout(async () => {
        try {
          const d = JSON.parse(await D.call("alert_debug"));
          const where = d.x != null ? ` at ${d.x}, ${d.y} (${d.w}×${d.h} px)` : "";
          if (d.drawn > 0 && d.visible) { out.className = "st-ok"; out.innerHTML = "<b>✓ Banner shown</b> <span class=\"muted\">" + D.esc(where) + ". Unlock the meter and drag it where you want alerts.</span>"; }
          else { out.className = "st-bad"; out.innerHTML = "<b>✕ The banner didn't appear</b> <span class=\"muted\">(" + D.esc(!d.exists ? "no alert window" : !d.visible ? "alert window hidden" : "alert window drew nothing") + D.esc(where) + "). Press Ctrl+Shift+P now to save a report and send it to us.</span>"; }
        } catch (e) { out.textContent = String(e); }
      }, 2500);
    };
    // A banner dragged while Settings is open sets "Where I dragged them";
    // follow it here so Save doesn't put the old choice back.
    const posSel = document.querySelector('[data-k="alerts.position"]');
    let posTouched = false;
    posSel.addEventListener("change", () => (posTouched = true));
    // Same for the layout, switched with the meter's button or the hotkey.
    const layIn = document.querySelector('[data-k="layout"]');
    let layTouched = false;
    document.querySelectorAll(".pick").forEach((p) => p.addEventListener("click", () => (layTouched = true)));
    const scaleIn = document.querySelector('[data-k="scale"]');
    let scaleTouched = false;
    scaleIn.addEventListener("input", () => (scaleTouched = true));
    if (window.__setPoll) clearInterval(window.__setPoll);
    window.__setPoll = setInterval(async () => {
      try {
        const n = await D.call("get_settings");
        if (!posTouched && n.alerts.position !== posSel.value) { posSel.value = n.alerts.position; s.alerts.position = n.alerts.position; }
        if (!layTouched && n.layout !== layIn.value) { layIn.value = n.layout; s.layout = n.layout; paintPicks(); }
        // Resized with Ctrl + wheel while Settings is open.
        if (!scaleTouched && Math.abs(n.scale - Number(scaleIn.value)) > 0.001) { scaleIn.value = n.scale; s.scale = n.scale; updateRanges(); }
      } catch {}
    }, 1500);
    document.getElementById("bRestart").onclick = async () => { await D.call("restart_capture"); D.toast("Capture restarted"); };
    document.getElementById("bReport").onclick = async () => {
      try { const p = await D.call("report_problem", { note: "settings" }); D.toast("Saved " + p.split(/[\\/]/).pop()); } catch (e) { D.toast(String(e)); }
    };
    document.getElementById("bReload").onclick = async () => {
      const r = JSON.parse(await D.call("reload_definitions"));
      D.toast(r.error ? "Error: " + r.error : "Loaded " + r.defs);
    };
    document.getElementById("bRefreshNames").onclick = async () => { await D.call("refresh_names"); D.toast("Downloading names… check Monster & skill names in a moment"); setTimeout(loadNames, 1500); };
    document.getElementById("bNames").onclick = () => D.call("open_window", { kind: "names" });
    document.querySelectorAll("[data-folder]").forEach((b) => (b.onclick = () => D.call("open_folder", { which: b.dataset.folder })));
  }

  document.getElementById("bSave").onclick = async () => {
    const next = collect();
    if (next.alerts.enabled && !/^https?:\/\//.test(next.alerts.feed_url)) { D.toast("Schedule feed must start with https://"); return; }
    if (next.share.enabled && next.share.endpoint && !/^https?:\/\//.test(next.share.endpoint)) { D.toast("Endpoint must start with https://"); return; }
    try {
      const errs = await D.call("save_settings", { settings: next });
      s = next;
      const HK = { click_through: "Toggle click-through", reset: "End fight", hide: "Hide / show overlay", copy: "Copy summary", report: "Report a problem", marker: "Research marker", layout: "Switch layout" };
      const nice = (errs || []).map((e) => e.replace(/^([a-z_]+) \(/, (m, k) => (HK[k] || k) + " (").replace("is already used by another program", "is taken by another program (Discord uses Ctrl+Shift+M, for example)"));
      document.getElementById("hkErr").textContent = nice.length ? "⚠ " + nice.join(" · ") + ". Pick another key, or leave it empty." : "";
      document.querySelector('.tab[data-t="hotkeys"]').classList.toggle("warn", nice.length > 0);
      D.toast(nice.length ? "Saved. One hotkey couldn't be set: " + nice[0] + " (see Hotkeys)" : "Saved");
    } catch (e) { D.toast("Could not save: " + e); }
  };

  // Reopening a hidden Settings window reloads the saved values.
  window.__reloadParams = () => init().catch((e) => (document.getElementById("form").textContent = String(e)));
  init().catch((e) => (document.getElementById("form").textContent = String(e)));
})();
</script>
</body>
</html>
