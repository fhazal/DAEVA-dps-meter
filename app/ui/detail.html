<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Details</title>
<link rel="stylesheet" href="common.css">
<style>
  .hdr { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big.acc { color: var(--accent); }
  .lbl { color: var(--muted); font-size: 12px; }
  .sp { flex: 1; }
  .tabs { display: inline-flex; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tabs button:disabled { opacity: 0.35; cursor: default; }
  .row2 { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  select.target { min-width: 240px; font-weight: 600; }
  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; margin-bottom: 12px; }
  .summary .l1 { font-weight: 600; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .summary .l2 { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .summary .l2 b { color: var(--text); font-variant-numeric: tabular-nums; }
  .chart { height: 90px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; margin-bottom: 12px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  td.sk { position: relative; font-weight: 600; }
  td.sk .bg { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--accent-soft); border-radius: 4px; z-index: 0; }
  td.sk span { position: relative; display: inline-flex; align-items: center; }
  .nameit { color: var(--accent); cursor: pointer; font-weight: 400; font-size: 11px; margin-left: 6px; }
  td.sk input { position: relative; width: 100%; font: inherit; padding: 1px 6px; }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 10px; }
</style>
</head>
<body>
<div class="shell">
  <div class="titlebar" data-tauri-drag-region>
    <div class="title" data-tauri-drag-region id="title">Details</div>
    <button class="icon-btn" id="bCopy" title="Copy skill breakdown"></button>
    <button class="icon-btn close" data-win="close" title="Close"></button>
  </div>
  <div class="scroll"><div class="content" id="c"><span class="muted">Loading…</span></div></div>
</div>
<script src="common.js"></script>
<script>
(() => {
  const D = window.Daeva;
  document.querySelector("[data-win=close]").innerHTML = D.icon("close");
  document.getElementById("bCopy").innerHTML = D.icon("copy");
  D.wireTitlebar();
  let p = {};
  let data = null;
  let tab = "dmg";
  let target = null; // null = all targets
  let timer = null;
  let record = null;
  let editing = false;

  async function load() {
    try {
      if (p.file) {
        if (!record) record = JSON.parse(await D.call("get_fight_record", { file: p.file }));
        data = (record.details || []).find((d) => d.id === p.actor_id) || null;
        if (data) data.fight_duration = record.duration;
      } else {
        data = await D.callJSON("get_detail", { fightId: p.fight_id ?? null, actorId: p.actor_id, target });
        const snap = await D.callJSON("get_snapshot", {});
        D.applyTheme(snap.ui);
        if (data && snap.fight) data.fight_duration = snap.fight.duration;
      }
      render();
    } catch (e) {
      document.getElementById("c").innerHTML = `<span class="muted">${D.esc(e)}</span>`;
    }
  }

  function chart(tl) {
    if (!tl || tl.length < 2) return "";
    const sm = tl.map((_, i) => { let s = 0, n = 0; for (let j = Math.max(0, i - 2); j <= i; j++) { s += tl[j]; n++; } return s / n; });
    const max = Math.max(1, ...sm);
    const W = 500, H = 74;
    const pts = sm.map((v, i) => `${((i / (sm.length - 1)) * W).toFixed(1)},${(H - (v / max) * H).toFixed(1)}`).join(" ");
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon points="0,${H} ${pts} ${W},${H}" fill="var(--accent-soft)"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <text x="4" y="10" fill="#9a978f" font-size="9">${D.fmt(max)}/s peak (3s avg)</text></svg></div>`;
  }

  const pc = (x) => D.pct(x, 1);

  function render() {
    const c = document.getElementById("c");
    if (!data) { c.innerHTML = '<span class="muted">No data for this player.</span>'; return; }
    document.getElementById("title").innerHTML = `${D.esc(data.name)} <small>${D.dur(data.fight_duration || data.active_time)}</small>`;
    const color = D.classColor(data.class, data.name);
    const targets = data.targets || [];
    const opts = [`<option value="">All targets · ${D.fmt(data.fight_dmg ?? data.dmg)}</option>`]
      .concat(targets.map((t) => `<option value="${t.id}" ${String(t.id) === String(target) ? "selected" : ""}>${D.esc(t.name)} · ${D.fmt(t.dmg)}</option>`)).join("");
    const head = `
      <div class="hdr">
        ${D.classIcon(data.class, 22)}
        <span class="big acc" style="color:${color}">${D.fmt(tab === "taken" ? data.taken : tab === "heal" ? data.heal : data.dmg)}</span>
        <span class="lbl">${tab === "taken" ? "damage taken" : tab === "heal" ? "healing" : "damage"}</span>
        <span class="big">${D.pct(data.active_share ?? 1)}</span><span class="lbl">active</span>
        ${data.cp ? `<span class="lbl">CP ${Number(data.cp).toLocaleString()}</span>` : ""}
        <span class="sp"></span>
        <span class="tabs">
          <button data-tab="dmg" class="${tab === "dmg" ? "on" : ""}">Dmg</button>
          <button data-tab="heal" class="${tab === "heal" ? "on" : ""}">Heal</button>
          <button data-tab="taken" class="${tab === "taken" ? "on" : ""}">Taken</button>
        </span>
      </div>`;
    let body;
    if (tab === "heal") {
      const hs = data.heal_skills || [];
      const who = data.healed || [];
      body = hs.length
        ? `<div class="summary"><div class="l1">${D.fmt(data.heal)} healing · ${D.fmt(data.heal / Math.max(1, data.fight_duration || data.active_time))}/s</div></div>
           <table class="grid"><thead><tr><th>Skill</th><th>Healing</th><th>%</th><th>Casts</th><th>Hits</th><th>Crit</th><th>Max</th><th>Avg</th></tr></thead><tbody>${hs.map((s) => `<tr><td>${D.skillIcon(s.id, 16)}${D.esc(s.name)}</td><td><b>${D.fmt(s.amount)}</b></td><td>${pc(s.share)}</td><td>${s.casts}×</td><td>${s.hits}</td><td>${pc(s.crit_rate)}</td><td>${D.fmt(s.max)}</td><td>${D.fmt(s.avg)}</td></tr>`).join("")}</tbody></table>
           <h2>Healed</h2><table class="grid"><tbody>${who.map((w) => `<tr><td>${D.esc(w.name)}</td><td>${D.fmt(w.amount)}</td></tr>`).join("")}</tbody></table>`
        : '<p class="muted">No healing in this fight.</p>';
    } else if (tab === "taken") {
      const rows = data.taken_from || [];
      const def = data.taken_hits ? `<div class="summary"><div class="l1">${data.taken_hits} hits taken</div><div class="l2"><span>Parried <b>${pc(data.taken_parry_rate)}</b></span><span>Blocked <b>${pc(data.taken_block_rate)}</b></span><span>Perfect parry/block <b>${pc(data.taken_perfect_block_rate)}</b></span></div></div>` : "";
      body = rows.length
        ? def + `<table class="grid"><thead><tr><th>Source</th><th>Damage</th><th>%</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${D.esc(r.name)}</td><td>${D.fmt(r.dmg)}</td><td>${pc(r.dmg / Math.max(1, data.taken))}</td></tr>`).join("")}</tbody></table>`
        : '<p class="muted">No damage taken in this fight.</p>';
    } else {
      const top = Math.max(1, ...data.skills.map((s) => s.dmg));
      body = `
        <div class="row2">${p.file ? "" : `<select class="target" id="tsel">${opts}</select>`}</div>
        <div class="summary">
          <div class="l1">${D.dur(data.active_time)} · ${D.fmt(data.dps)} DPS · ${data.casts ?? "–"} casts · ${data.hits} hits · max ${D.fmt(data.max_hit)}</div>
          <div class="l2">
            <span>Crit <b>${pc(data.crit_rate)}</b></span>
            <span>Parry <b>${pc(data.parry_rate)}</b></span>
            <span>Back <b>${pc(data.back_rate)}</b></span>
            <span>Front <b>${pc(data.front_rate)}</b></span>
            <span>Perfect <b>${pc(data.perfect_rate)}</b></span>
            <span>Double <b>${pc(data.double_rate)}</b></span>
            <span>Multi <b>${pc(data.multi_rate)}</b></span>
          </div>
        </div>
        ${target ? "" : chart(data.timeline)}
        <table class="grid">
          <thead><tr><th>Skill</th><th>Damage</th><th>%</th><th>Casts</th><th>Hits</th><th>Multi%</th><th>Crit</th><th>Back</th><th>Front</th><th>Double</th><th>Max</th><th>Avg</th><th>Parry%</th></tr></thead>
          <tbody>${data.skills.map((s) => `<tr>
            <td class="sk" data-skill="${s.id}"><i class="bg" style="width:${((s.dmg / top) * 100).toFixed(1)}%"></i><span>${D.skillIcon(s.id, 18)}${D.esc(s.name)}</span>${s.named === false ? `<span class="nameit" title="Name this skill (saved for good)">✎</span><span class="nameit lk" data-lk="${s.id}" title="Open on aion2.gaming.tools">🔎</span>` : ""}</td>
            <td><b>${D.fmt(s.dmg)}</b></td><td>${pc(s.share)}</td>
            <td>${s.casts == null ? "–" : s.casts + "×"}</td><td>${s.hits}</td><td>${pc(s.multi_rate)}</td>
            <td>${pc(s.crit_rate)}</td><td>${pc(s.back_rate)}</td><td>${pc(s.front_rate)}</td><td>${pc(s.double_rate)}</td>
            <td>${D.fmt(s.max)}</td><td>${D.fmt(s.avg)}</td><td>${pc(s.parry_rate)}</td></tr>`).join("")}</tbody>
        </table>
        <div class="note">Crit, Back, Front, Perfect, Double and multi-hits are confirmed. Rates are per damage result, like Abyss.</div>`;
    }
    if (editing) return;
    c.innerHTML = head + body;
    c.querySelectorAll("td.sk [data-lk]").forEach((b) => (b.onclick = (ev) => { ev.stopPropagation(); D.call("open_lookup", { kind: "skill", id: Number(b.dataset.lk) }).catch((e) => D.toast(String(e))); }));
    c.querySelectorAll("td.sk .nameit:not(.lk)").forEach((b) => (b.onclick = () => {
      const td = b.closest("td");
      editing = true;
      td.querySelectorAll("span").forEach((x) => x.remove());
      td.insertAdjacentHTML("beforeend", '<input maxlength="60" placeholder="Skill name, then Enter">');
      const i = td.querySelector("input");
      i.focus();
      const done = () => { editing = false; render(); };
      i.onkeydown = async (ev) => {
        if (ev.key === "Escape") return done();
        if (ev.key !== "Enter" || !i.value.trim()) return;
        try { const n = await D.call("set_name", { kind: "skill", id: Number(td.dataset.skill), name: i.value }); D.toast("Saved: " + n); } catch (e) { D.toast(String(e)); }
        done();
        load();
      };
      i.onblur = () => setTimeout(() => { if (editing && document.activeElement !== i) done(); }, 150);
    }));
    c.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { if (!b.disabled) { tab = b.dataset.tab; render(); } }));
    const sel = document.getElementById("tsel");
    if (sel) sel.onchange = () => { target = sel.value ? Number(sel.value) : null; load(); };
  }

  document.getElementById("bCopy").onclick = async () => {
    if (!data) return;
    const lines = [`**${data.name}**${data.class ? " (" + data.class + ")" : ""} — ${D.fmt(data.dmg)} dmg, ${D.fmt(data.dps)}/s · crit ${pc(data.crit_rate)}`];
    data.skills.slice(0, 12).forEach((s, i) => lines.push(`\`${String(i + 1).padStart(2)}.\` ${s.name} — ${D.fmt(s.dmg)} (${pc(s.share)}) · ${s.casts ?? "?"} casts · ${s.hits} hits · crit ${pc(s.crit_rate)}`));
    try { await D.call("copy_text", { text: lines.join("\n") }); D.toast("Copied"); } catch (e) { D.toast(String(e)); }
  };

  async function init() {
    p = await D.params();
    target = null;
    record = null;
    clearInterval(timer);
    await D.loadArt();
    await load();
    if (!p.file) timer = setInterval(load, 1000);
  }
  window.__reloadParams = init;
  init();
})();
</script>
</body>
</html>
