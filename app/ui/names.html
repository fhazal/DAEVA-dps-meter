<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Names</title>
<link rel="stylesheet" href="common.css">
<style>
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; align-items: center; }
  .tab { padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .tab.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tabs .sp { flex: 1; }
  .intro { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
  table.grid td { vertical-align: middle; }
  td.id { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  td.inp { width: 46%; }
  td.inp input { width: 100%; }
  .count { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .done { color: var(--good); }
  .lk { cursor: pointer; color: var(--accent); white-space: nowrap; }
  .st { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .st.pending { color: var(--warn); }
  .credit { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .credit a { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="shell">
  <div class="titlebar" data-tauri-drag-region>
    <div class="title" data-tauri-drag-region>Names</div>
    <button class="icon-btn close" data-win="close" title="Close"></button>
  </div>
  <div class="scroll"><div class="content">
    <div class="tabs">
      <span class="tab on" data-tab="npcs">Monsters<span class="count" id="cN"></span></span>
      <span class="tab" data-tab="skills">Skills<span class="count" id="cS"></span></span>
      <span class="tab" data-tab="mine">Your names<span class="count" id="cM"></span></span>
      <span class="sp"></span>
      <button class="btn" id="bFolder">Open folder</button>
    </div>
    <p class="intro" id="intro"></p>
    <div id="list"></div>
    <div class="credit" id="credit"></div>
  </div></div>
</div>
<script src="common.js"></script>
<script>
(() => {
  const D = window.Daeva;
  document.querySelector("[data-win=close]").innerHTML = D.icon("close");
  D.wireTitlebar();
  let tab = "npcs";
  let data = { npcs: [], skills: [], named: [] };
  const INTRO = {
    npcs: "Monsters met without a name, most recent first. Names come from aion2.gaming.tools automatically (updated daily); for anything not there yet, type the name from the target frame and press Enter. Your name always wins and fixes old fights too.",
    skills: "Player skills seen without a name. One name covers every rank and variant of that skill, DoT included.",
    mine: "Everything you have named. This is your own database, saved as my-names.json in the data folder. Clear a name and press Enter to remove it.",
  };

  document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => {
    tab = t.dataset.tab;
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
    render();
  }));
  document.getElementById("bFolder").onclick = () => D.call("open_folder", { which: "data" });

  async function refresh() {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    try { data = await D.callJSON("get_names"); render(); } catch (e) { document.getElementById("list").textContent = String(e); }
  }

  const ago = (t) => (t ? D.when(t) : "");
  const ST = { pending: "Waiting for name data", missing: "Not on gaming.tools", failed: "Lookup failed, retrying later", off: "" };
  const st = (x) => `<span class="st ${x.lookup || ""}">${ST[x.lookup] || ""}</span>`;
  const lk = (kind, id) => `<span class="lk" data-lk="${kind}" data-lid="${id}" title="Open this ${kind === "npc" ? "monster" : "skill"} on aion2.gaming.tools">🔎</span>`;
  const input = (kind, id, value, ph) => `<input type="text" maxlength="60" data-kind="${kind}" data-id="${id}" value="${D.esc(value || "")}" placeholder="${D.esc(ph || "Type the name, press Enter")}">`;

  function render() {
    document.getElementById("cN").textContent = data.npcs.length || "";
    document.getElementById("cS").textContent = data.skills.length || "";
    document.getElementById("cM").textContent = data.named.length || "";
    document.getElementById("intro").textContent = INTRO[tab];
    const el = document.getElementById("list");
    if (tab === "npcs") {
      el.innerHTML = data.npcs.length
        ? `<table class="grid"><thead><tr><th>Monster</th><th>Max HP</th><th>Where</th><th>Seen</th><th></th><th>Name</th></tr></thead><tbody>${data.npcs.map((n) => `
          <tr><td class="id">#${n.id} ${lk("npc", n.id)}</td><td>${n.max_hp ? D.fmt(n.max_hp) : "–"}</td><td>${D.esc(n.zone || "")}</td><td>${ago(n.last)}</td><td>${st(n)}</td><td class="inp">${input("npc", n.id)}</td></tr>`).join("")}</tbody></table>`
        : '<p class="done">Every monster you have met has a name.</p>';
    } else if (tab === "skills") {
      el.innerHTML = data.skills.length
        ? `<table class="grid"><thead><tr><th>Skill</th><th>Class</th><th>Seen</th><th></th><th>Name</th></tr></thead><tbody>${data.skills.map((s) => `
          <tr><td class="id">${s.id} ${lk("skill", s.id)}</td><td>${D.classIcon(s.class, 12)} ${D.esc(s.class || "")}</td><td>${ago(s.last)}</td><td>${st(s)}</td><td class="inp">${input("skill", s.id)}</td></tr>`).join("")}</tbody></table>`
        : '<p class="done">Every skill you have seen has a name.</p>';
    } else {
      el.innerHTML = data.named.length
        ? `<table class="grid"><thead><tr><th>Type</th><th>Id</th><th>Name</th></tr></thead><tbody>${data.named.map((n) => `
          <tr><td>${n.kind === "npc" ? "Monster" : "Skill"}</td><td class="id">${n.id}</td><td class="inp">${input(n.kind, n.id, n.name)}</td></tr>`).join("")}</tbody></table>`
        : '<p class="muted">Nothing named yet.</p>';
    }
    el.querySelectorAll("[data-lk]").forEach((b) => (b.onclick = () => D.call("open_lookup", { kind: b.dataset.lk, id: Number(b.dataset.lid) }).catch((e) => D.toast(String(e)))));
    document.getElementById("credit").innerHTML = `Monster and skill names from the <a id="gt">AION 2 Global Database (aion2.gaming.tools)</a>, used with the kind permission of its team${data.site_bulk ? ` · ${data.site_bulk.npcs.toLocaleString()} monsters and ${data.site_bulk.skills.toLocaleString()} skills, updated ${D.when(data.site_bulk.at)}` : data.site_count ? ` · ${data.site_count} names fetched so far` : ""}.${data.lookup_status ? ` <span class="st">${D.esc(data.lookup_status)}</span>` : ""}${data.lookup_on === false ? " Automatic look-ups are off in Settings." : ""}`;
    document.getElementById("gt").onclick = () => D.call("open_lookup", { kind: "site", id: 0 });
    el.querySelectorAll("input[data-kind]").forEach((i) => {
      i.onkeydown = async (ev) => {
        if (ev.key === "Escape") { i.value = i.defaultValue; i.blur(); return; }
        if (ev.key !== "Enter") return;
        if (!i.value.trim() && tab !== "mine") return;
        try {
          const saved = await D.call("set_name", { kind: i.dataset.kind, id: Number(i.dataset.id), name: i.value });
          D.toast(saved ? `Saved: ${saved}` : "Name removed");
          i.blur();
          i.value = "";
          refresh();
        } catch (e) { D.toast(String(e)); }
      };
    });
  }

  window.__reloadParams = refresh;
  D.callJSON("get_snapshot", {}).then((s) => D.applyTheme(s.ui)).catch(() => {});
  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
